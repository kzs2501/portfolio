name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit, with the tag alongside: a tag can be moved, a commit
# can't. Dependabot updates both.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint reads the pull request's commits
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # What ships must have no known high-severity vulnerabilities. Dev tooling is
      # left to Dependabot: its advisories are often unfixable until upstream moves.
      - run: npm audit --omit=dev --audit-level=high

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Browser + accessibility tests (axe, keyboard, 375px, reduced motion)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Lighthouse budgets (fail below 95 in any category)
        run: npm run lhci
      # On a mid-range phone: accessibility, best practices, SEO and layout shift fail
      # the run; performance and LCP only warn, since the simulated phone is slow.
      - name: Lighthouse budgets, mobile
        run: npm run lhci:mobile

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports
          path: |
            playwright-report
            test-results
            .lighthouseci
            .lighthouseci-mobile
