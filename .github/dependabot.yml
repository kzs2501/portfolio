# Weekly dependency updates, grouped so routine bumps arrive as one pull request.
# Major versions still come one by one: they're the ones that need reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types describe the runtime, and the runtime moves on purpose (.nvmrc, engines),
      # not whenever Node ships a new major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
